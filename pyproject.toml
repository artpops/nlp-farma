[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "symptom-drug-advisor"
version = "1.0.0"
description = "Hibridni NLP savetnik za simptome i lekove (srpski, offline-first)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "numpy==1.26.4",
  "pandas==2.1.4",
  "scikit-learn==1.3.2",
  "scipy==1.11.4",
  "rapidfuzz==3.6.1",
  "matplotlib==3.8.2",
  "streamlit==1.32.0",
]

[project.optional-dependencies]
test = [
  "pytest==8.0.0",
]

[project.scripts]
sda = "sda.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
